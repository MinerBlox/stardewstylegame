<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17231b" />
  <title>Brackenvale</title>
  <link rel="stylesheet" href="./css/game.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540" aria-label="Brackenvale game canvas"></canvas>
    <div id="title-screen" class="overlay title-screen">
      <div class="crest">♜</div>
      <h1>BRACKENVALE</h1>
      <p class="subtitle">A small life beneath old stone walls.</p>
      <div class="menu-stack">
        <button id="new-game">New Game</button>
        <button id="continue-game">Continue</button>
        <button id="settings-button">Settings</button>
      </div>
      <p class="tiny">WASD / Arrows · E interact · I inventory · Esc close</p>
    </div>
    <div id="hud" class="hud hidden">
      <div class="hud-chip"><span id="clock">08:00</span><small id="daypart">Morning</small></div>
      <div class="hud-chip coins">◉ <span id="money">120</span></div>
      <div id="hotbar" class="hotbar"></div>
      <div id="prompt" class="prompt hidden"></div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <div id="dialogue" class="panel dialogue hidden">
      <div id="dialogue-name" class="panel-title"></div>
      <div id="dialogue-text"></div>
      <div class="continue-mark">E / Space</div>
    </div>
    <div id="inventory" class="panel modal hidden">
      <div class="panel-heading"><h2>Satchel</h2><button data-close="inventory">×</button></div>
      <div class="inventory-layout"><div id="inventory-grid" class="inventory-grid"></div><div id="item-details" class="item-details"><h3>Select an item</h3><p>Your carried goods appear here.</p></div></div>
    </div>
    <div id="shop" class="panel modal hidden">
      <div class="panel-heading"><div><h2 id="shop-name">Shop</h2><p id="shop-subtitle"></p></div><button data-close="shop">×</button></div>
      <div id="shop-grid" class="shop-grid"></div>
    </div>
    <div id="settings" class="panel modal small hidden">
      <div class="panel-heading"><h2>Settings</h2><button data-close="settings">×</button></div>
      <label>Master volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.45"></label>
      <button id="fullscreen">Toggle fullscreen</button>
      <p class="tiny">Progress and settings are stored locally in this browser.</p>
    </div>
    <div id="fade" class="fade"></div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
